spring:
  application:
    name: myagent
  datasource:
    url: jdbc:mysql://localhost:3306/myagent?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

server:
  port: 8080

agent:
  workspace:
    path: ./.agentscope/workspace
  memory:
    enabled: true
  agent-scope:
    enabled: ${AGENT_SCOPE_ENABLED:false}
  model:
    provider: ${AGENT_MODEL_PROVIDER:dashscope}
    name: ${AGENT_MODEL_NAME:dashscope:qwen-plus}
    base-url: ${AGENT_MODEL_BASE_URL:}
    api-key-env: ${AGENT_MODEL_API_KEY_ENV:DASHSCOPE_API_KEY}
  state-store:
    type: redis
    redis:
      uri: redis://localhost:6379
      key-prefix: "myagent:agent-state:"
  skill:
    storage: agentscope
    cache-dir: ./.agentscope/cache/skills
    environment: ${AGENT_SKILL_ENVIRONMENT:prod}
    canary-percent: ${AGENT_SKILL_CANARY_PERCENT:10}
    manage-tool-enabled: ${AGENT_SKILL_MANAGE_TOOL_ENABLED:true}
    security-scan-enabled: ${AGENT_SKILL_SECURITY_SCAN_ENABLED:true}
    approval-mode: ${AGENT_SKILL_APPROVAL_MODE:web}
  permission:
    default-mode: DEFAULT
  tools:
    file-tools-enabled: false
    shell-enabled: false
    http-fetch-enabled: false
    mcp-enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
