spring:
  application:
    name: myagent
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:myagent}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KNOWLEDGE_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.myagent.knowledge.messaging.KnowledgeDocumentProcessMessage
        spring.json.trusted.packages: com.example.myagent.knowledge.messaging
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8080

agent:
  workspace:
    path: ./.agentscope/workspace
  agent-scope:
    enabled: ${AGENT_SCOPE_ENABLED:false}
  model:
    provider: ${AGENT_MODEL_PROVIDER:dashscope}
    name: ${AGENT_MODEL_NAME:dashscope:qwen-plus}
    base-url: ${AGENT_MODEL_BASE_URL:}
    api-key-env: ${AGENT_MODEL_API_KEY_ENV:DASHSCOPE_API_KEY}
  state-store:
    type: redis
    redis:
      uri: redis://${REDIS_HOST:redis}:${REDIS_PORT:6379}
      key-prefix: "myagent:agent-state:"
  skill:
    storage: agentscope
    cache-dir: ./.agentscope/cache/skills
    environment: ${AGENT_SKILL_ENVIRONMENT:prod}
    canary-percent: ${AGENT_SKILL_CANARY_PERCENT:10}
    manage-tool-enabled: ${AGENT_SKILL_MANAGE_TOOL_ENABLED:true}
    security-scan-enabled: ${AGENT_SKILL_SECURITY_SCAN_ENABLED:true}
  permission:
    default-mode: DEFAULT
  tools:
    file-tools-enabled: ${AGENT_TOOLS_FILE_TOOLS_ENABLED:false}
    shell-enabled: ${AGENT_TOOLS_SHELL_ENABLED:false}
    http-fetch-enabled: ${AGENT_TOOLS_HTTP_FETCH_ENABLED:false}
    mcp-enabled: ${AGENT_TOOLS_MCP_ENABLED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}

knowledge:
  embedding:
    provider: ${KNOWLEDGE_EMBEDDING_PROVIDER:dashscope}
    model: ${KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${KNOWLEDGE_EMBEDDING_DIMENSIONS:1024}
    api-key-env: ${KNOWLEDGE_EMBEDDING_API_KEY_ENV:DASHSCOPE_API_KEY}
  multimodal:
    provider: ${KNOWLEDGE_MULTIMODAL_PROVIDER:dashscope}
    model: ${KNOWLEDGE_MULTIMODAL_MODEL:qwen3.7-plus}
    api-key-env: ${KNOWLEDGE_MULTIMODAL_API_KEY_ENV:DASHSCOPE_API_KEY}
  elasticsearch:
    url: ${KNOWLEDGE_ELASTICSEARCH_URL:http://elasticsearch:9200}
    username: ${KNOWLEDGE_ELASTICSEARCH_USERNAME:elastic}
    password: ${KNOWLEDGE_ELASTICSEARCH_PASSWORD:}
    parent-index: ${KNOWLEDGE_ELASTICSEARCH_PARENT_INDEX:myagent_knowledge_parents}
    child-index: ${KNOWLEDGE_ELASTICSEARCH_CHILD_INDEX:myagent_knowledge_children}
  kafka:
    topic: ${KNOWLEDGE_KAFKA_TOPIC:myagent.knowledge.document.process}
    group: ${KNOWLEDGE_KAFKA_GROUP:myagent-knowledge-etl}
    bootstrap-servers: ${KNOWLEDGE_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    relay-delay-ms: ${KNOWLEDGE_KAFKA_RELAY_DELAY_MS:1000}
    max-attempts: ${KNOWLEDGE_KAFKA_MAX_ATTEMPTS:5}
  storage:
    root: ${KNOWLEDGE_STORAGE_ROOT:./.knowledge/storage}
